[package]
name = "kyumaru"
version = "0.1.1"
edition = "2026"

[lib]
name = "kyumaru"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
flate2 = "1.0"
chrono = { version = "0.4", features = ["clock"] }
rmpv = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
